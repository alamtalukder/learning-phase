<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API </title>
</head>

<body>
    <h1>JSON</h1>
    <h2>Javascript object notation</h2>
    <ul id = "users-container">
    </ul>


    <input id="title" type="text" placeholder="title">
    <input id="bodyContent" type="text" placeholder="body information">

    <button id ="submit">Submit</button>

    <script>
        const submitButton = document.getElementById('submit').addEventListener('click', () => {
            const title = document.getElementById('title').value;
            const bodyContent = document.getElementById('bodyContent').value;
            const posts = {title: title, body: bodyContent}; 
            nowPostToServer(posts);
        });
        
        function nowPostToServer(postInfo){
            fetch('https://jsonplaceholder.typicode.com/posts', {
            method: 'POST',
            body: JSON.stringify(postInfo),
            headers: {
                'Content-type': 'application/json; charset=UTF-8',},
            })
            .then((response) => response.json())
            .then(data => console.log(data))
            .catch(error => alert("Please try again"));  
        }
          

        fetch('https://jsonplaceholder.typicode.com/users')
            .then(response => response.json())
            .then(json => displayUsers(json))
            .catch(error => console.log(error)); 

            function displayUsers(users){
                const usersNames = users.map(user => user.username); 
                const ul = document.getElementById('users-container');

                for(let i=0; i<usersNames.length; i++){
                    const userName = usersNames[i]; 
                    const li = document.createElement('li'); 
                    li.innerText = userName;
                    ul.appendChild(li);
                }
            }
    </script>
</body>

</html>
