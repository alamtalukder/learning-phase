<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users API</title>
    <style>
        .user{
            color: royalblue
        }
    </style>
</head>
<body>
    <input id="count" type="text"><button id="load-user" type="button">load User</button>

    <div id="users">

    </div>

    <div id="user-details">

    </div>
 
    <script>
        document.getElementById('load-user').addEventListener('click', function(){
            const count = document.getElementById('count').value;
            const countText = parseInt(count);
            console.log(countText);

             fetch('https://jsonplaceholder.typicode.com/users')
             .then(res => res.json())
             .then (data =>{
                data = data.slice(0, countText);
            const userContainer = document.getElementById('users');
            userContainer.innerHTML = '';

            for (let i=0; i<data.length; i++){
                const user = data[i];
                const p = document.createElement('p'); 
                p.innerHTML = `<p class = 'user'><strong>${user.name}</strong> <button onclick = "getUserDetails(${user.id})">Get Details-${user.id}</button></p>`;
                userContainer.appendChild(p);
            }
        })
        })
        function getUserDetails(userId){
            fetch(`https://jsonplaceholder.typicode.com/users/${userId}`)
            .then(res => res.json())
            .then(data =>{
                const userDetails = document.getElementById('user-details');
                userDetails.innerHTML = `<h3>User Details ${userId}:</h3>
                <p><strong>Name:</strong> ${data.name}</p>
                <p><strong>Email:</strong> ${data.email}</p>
                <p><strong>Phone:</strong> ${data.phone}</p>`
            })
        }
    </script>
</body>
</html>
